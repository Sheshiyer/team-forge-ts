name: Worker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/worker

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloudflare/worker/pnpm-lock.yaml

      - name: Install Worker dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject retired execution authority
        run: pnpm check:retired-routing

      - name: Type check Worker
        run: pnpm check

      - name: Test GitHub control plane
        run: >-
          pnpm exec vitest run --config vitest.config.ts
          src/routes/__tests__/github.test.ts
          src/routes/__tests__/github-migration.test.ts

      - name: Test Worker
        run: pnpm test
